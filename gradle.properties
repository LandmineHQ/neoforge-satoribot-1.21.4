# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Selects versionProperties/<mcVer>.properties.
# Override with: ./gradlew build -PmcVer=1.21.4
mcVer=26.1.2

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale.
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=satoribot

# The human-readable display name for the mod.
mod_name=SatoriBot

# The license of the mod.
mod_license=All Rights Reserved

# The mod version. See https://semver.org/
mod_version=1.0.0

# The group ID for the mod. This should match the base package used for the mod sources.
mod_group_id=github.landminehq.satoribot
