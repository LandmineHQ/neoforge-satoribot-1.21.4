plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
}

def defaultMcVer = '26.1.2'
def selectedMcVer = (findProperty('mcVer') ?: defaultMcVer).toString()
def versionPropertiesDir = file('versionProperties')
def versionPropertyFiles = versionPropertiesDir.exists()
        ? versionPropertiesDir.listFiles({ dir, name ->
            name.endsWith('.properties') && !name.startsWith('_')
        } as java.io.FilenameFilter)
        : new File[0]
def supportedMcVersions = versionPropertyFiles
        .collect { it.name.substring(0, it.name.length() - '.properties'.length()) }
        .sort()
def selectedVersionPropertiesFile = file("versionProperties/${selectedMcVer}.properties")

if (!selectedVersionPropertiesFile.isFile()) {
    throw new GradleException(
            "No version properties found for mcVer=${selectedMcVer}. " +
                    "Add versionProperties/${selectedMcVer}.properties or choose one of: ${supportedMcVersions.join(', ')}"
    )
}

def mcVersionProperties = new Properties()
selectedVersionPropertiesFile.withInputStream { stream ->
    mcVersionProperties.load(stream)
}

def requireVersionProperty = { String key ->
    def value = mcVersionProperties.getProperty(key)
    if (value == null || value.trim().isEmpty()) {
        throw new GradleException("${selectedVersionPropertiesFile} is missing required property '${key}'.")
    }
    value.trim()
}

def optionalVersionProperty = { String key, String fallback ->
    def value = mcVersionProperties.getProperty(key)
    value == null || value.trim().isEmpty() ? fallback : value.trim()
}

def minecraftVersion = requireVersionProperty('minecraft_version')
def minecraftVersionRange = requireVersionProperty('minecraft_version_range')
def neoVersion = requireVersionProperty('neo_version')
def loaderVersionRange = requireVersionProperty('loader_version_range')
def javaVersion = requireVersionProperty('java_version').toInteger()
def parchmentMinecraftVersion = optionalVersionProperty('parchment_minecraft_version', minecraftVersion)
def parchmentMappingsVersion = optionalVersionProperty('parchment_mappings_version', '')
def supportsClientDataRun = optionalVersionProperty('supports_client_data_run', 'true').toBoolean()

def exportedProperties = [
        selected_mc_version        : selectedMcVer,
        minecraft_version          : minecraftVersion,
        minecraft_version_range    : minecraftVersionRange,
        neo_version                : neoVersion,
        loader_version_range       : loaderVersionRange,
        java_version               : javaVersion,
        parchment_minecraft_version: parchmentMinecraftVersion,
        parchment_mappings_version : parchmentMappingsVersion,
]

if (!parchmentMappingsVersion.isBlank()) {
    exportedProperties['neogradle.subsystems.parchment.minecraftVersion'] = parchmentMinecraftVersion
    exportedProperties['neogradle.subsystems.parchment.mappingsVersion'] = parchmentMappingsVersion
}

exportedProperties.each { key, value ->
    ext.set(key, value)
}

layout.buildDirectory.set(layout.projectDirectory.dir("build/${selectedMcVer}"))

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.java {
    srcDir('src/loader/neoforge/common/java')
    srcDir("src/versioned/${selectedMcVer}/java")
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Include resources shared by all NeoForge implementations.
    srcDir('src/loader/neoforge/common/resources')

    // Include resources that only apply to the selected Minecraft version.
    srcDir("src/versioned/${selectedMcVer}/resources")

    // Exclude common development only resources from finalized outputs.
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // Add here additional repositories if required by dependencies below.
}

base {
    archivesName = "${mod_id}-neoforge-${minecraftVersion}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)

// minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
// minecraft.accessTransformers.entry public net.minecraft.client.Minecraft textureManager # textureManager

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    if (supportsClientDataRun) {
        clientData {
            arguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/').getAbsolutePath(), '--existing',
                    file('src/main/resources/').getAbsolutePath()
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neoVersion}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraftVersion,
            minecraft_version_range: minecraftVersionRange,
            neo_version            : neoVersion,
            loader_version_range   : loaderVersionRange,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.register('printSelectedMinecraftVersion') {
    group = 'help'
    description = 'Prints the Minecraft and NeoForge versions selected for this Gradle invocation.'
    doLast {
        println "mcVer=${selectedMcVer}"
        println "minecraft_version=${minecraftVersion}"
        println "neo_version=${neoVersion}"
        println "java_version=${javaVersion}"
        println "version_properties=${selectedVersionPropertiesFile}"
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
