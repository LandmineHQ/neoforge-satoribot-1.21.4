name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag points to main
        shell: bash
        run: |
          git fetch origin main --depth=1
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q "origin/main"; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit on origin/main."
            exit 1
          fi

  versions:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover Minecraft versions
        id: versions
        shell: bash
        run: |
          mapfile -t files < <(find versionProperties -maxdepth 1 -type f -name '*.properties' ! -name '_*' | sort -V)
          for file in "${files[@]}"; do
            mc_version="$(basename "$file" .properties)"
            java_version="$(awk -F= '$1 == "java_version" { gsub(/[[:space:]]/, "", $2); print $2 }' "$file")"
            jq -cn --arg mc_version "$mc_version" --arg java_version "${java_version:-21}" '{mc_version: $mc_version, java_version: $java_version}'
          done | jq -cs '{include: .}' | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      upload_artifact: true
      artifact_name: release-jars-${{ matrix.mc_version }}
      fetch_depth: 0
      fetch_tags: true
      mc_version: ${{ matrix.mc_version }}
      java_version: ${{ matrix.java_version }}

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build jars
        uses: actions/download-artifact@v4
        with:
          pattern: release-jars-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*.jar
