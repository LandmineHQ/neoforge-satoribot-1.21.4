# Copy this file to versionProperties/<mc-version>.properties and fill in the target values.
# Example: versionProperties/1.20.1.properties

minecraft_version=
minecraft_version_range=
neo_version=
loader_version_range=[1,)
java_version=

# Optional. Leave parchment_mappings_version empty to disable explicit parchment configuration.
parchment_minecraft_version=
parchment_mappings_version=

# Optional. Set false when the selected NeoForge line does not expose clientData.
supports_client_data_run=true
